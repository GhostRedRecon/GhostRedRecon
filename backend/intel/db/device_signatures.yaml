version: "2026-03-06"

purpose: >
  RF device fingerprinting reference for GhostRecon.
  Used by SignalEngine and DeviceBehaviorEngine to infer device types
  from RF characteristics including frequency, bandwidth, modulation,
  burst timing patterns and protocol hints.

# =====================================================================
# PROTOCOL FAMILIES
# =====================================================================

protocol_families:

  zigbee_ieee802154_24ghz:
    band_mhz: [2400.0, 2483.5]
    modulation: ["DSSS-OQPSK"]
    channel_bw_mhz: 2
    data_rate: "250 kbps"
    encryption: "AES-128"
    burst_patterns:
      beacon_ms: [100, 120]
      sensor_trigger_ms: [5, 20]

  bluetooth_le:
    band_mhz: [2400.0, 2483.5]
    modulation: ["GFSK"]
    hopping: true
    channels: 40
    encryption: "AES-CCM"
    burst_patterns:
      advertising_interval_ms: [20, 10240]

  bluetooth_classic_bredr:
    band_mhz: [2402.0, 2480.0]
    modulation: ["GFSK", "π/4-DQPSK", "8DPSK"]
    hopping: true
    channels: 79
    encryption: "Bluetooth Link Layer"

  wifi_24ghz:
    band_mhz: [2400.0, 2483.5]
    modulation: ["OFDM", "DSSS"]
    channel_bw_mhz: [20, 40]
    encryption: ["WPA2", "WPA3"]
    burst_patterns:
      beacon_ms: [100]

  srd_433_eu:
    band_mhz: [433.05, 434.79]
    modulation: ["OOK", "ASK", "FSK"]
    typical_bw_khz: [5, 40]

  wireless_mbus_868_eu:
    band_mhz: [863.0, 870.0]
    modulation: ["2-FSK"]
    typical_bw_khz: [200, 350]

  lora_phy_subghz:
    bands:
      eu868: [863.0, 870.0]
      us915: [902.0, 928.0]
    modulation: ["LoRa CSS"]
    bandwidth_khz: [125, 250, 500]

