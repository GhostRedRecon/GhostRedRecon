# =============================================================================
# ARCHITECTURE NOTES
# -----------------------------------------------------------------------------
# - This file is the STRATEGIC INTENT LAYER of GhostRecon
# - No scan logic is hardcoded in Python
# - Recon / Session scheduling builds presets dynamically from this file
# - Intel classifier uses these intents to bias category selection + risk scoring
# - This file defines EXPECTATIONS (behavior, modulation, encryption likelihood),
#   not exploit procedures.
#
# PHASE 1 ADDITION (v7.3.0)
# -----------------------------------------------------------------------------
# - Adds EU residential mixed-environment categories for:
#     Sub-GHz (433/868): remotes, fixed switches, alarms, weather sensors, meters
#     Zigbee (2.4): hubs + end devices
#     BLE (2.4): beacons + personal devices
# - Adds explicit encryption_profile blocks to ALL categories to support:
#     "what kind of encryption is expected" intelligence outputs in UI/API
# =============================================================================


# =============================================================================
# CATEGORIES (FULL INTELLIGENCE MODEL)
# =============================================================================

categories:

  # ===========================================================================
  # DRONES — CONTROL & TELEMETRY
  # ===========================================================================
  drone:
    description: Drone telemetry and control sub-GHz links
    risk_level: high
    target_value: 4
    behavior: continuous
    environment: mobility

    decoder_profile:
      modulation: fsk
      symbol_rate_hint: 50000
      bandwidth_khz: 200
      rolling_expected: false
      frame_length_hint: 128
      entropy_expected: high

    rf_profile:
      fhss_expected: true
      control_channel_bias: 0.7
      telemetry_bias: 0.9
      encryption_likelihood: high

    encryption_profile:
      expected: "link-layer crypto likely"
      common_schemes:
        - "proprietary stream/AES-like (vendor-specific)"
        - "rolling session keys / pairing keys (varies)"
      key_management:
        - "paired controller ↔ drone link"
        - "session or device key (varies)"
      notes:
        - "Treat as high-entropy traffic; do not assume replayable."

    offensive_profile:
      replay_feasible: false
      command_injection_feasible: low
      jamming_resilience: high
      requires_sync_capture: true

    bands:
      - start_mhz: 433.0
        end_mhz: 435.0
        step_khz: 50
      - start_mhz: 902.0
        end_mhz: 928.0
        step_khz: 250


  # ===========================================================================
  # INDUSTRIAL ROBOTICS / UGV
  # ===========================================================================
  robotics_ugv:
    description: Industrial robots and unmanned ground vehicles
    risk_level: critical
    target_value: 5
    behavior: mixed
