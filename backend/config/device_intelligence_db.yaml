# =============================================================================
# PROJECT:      GHOSTRECON
# FILE:         backend/intel/db/device_intelligence_db.yaml
# VERSION:      v3.0.0
# LAST UPDATED: 2026-03-15
#
# =============================================================================
# PROJECT CONTEXT
# =============================================================================
# GhostRecon is an RF red-team intelligence platform designed for passive
# spectrum reconnaissance, protocol inference, device classification, product
# identification, and attack-surface prioritization.
#
# This database is the canonical passive intelligence knowledge base used by
# DeviceIntelligenceEngine v5.x. It replaces fragmented protocol/device/product
# YAML stores with one normalized schema so the engine can perform:
#
#   1. protocol-family-aware device scoring
#   2. vendor and product hint fusion
#   3. burst-shape and interval correlation
#   4. red-team attack-surface enrichment
#   5. explainable evidence-based device ranking
#
# =============================================================================
# ARCHITECTURE
# =============================================================================
# Recon / PHY / Protocol Layers
#      ↓
# signal_engine.py
#      ↓
# protocol_engine.py
#      ↓
# device_intelligence_engine.py
#      ↓
# device_intelligence_db.yaml  <--- THIS FILE
#      ↓
# device class / vendor / product scoring
#      ↓
# red-team surface enrichment
#      ↓
# API / frontend / graph / reporting
#
# =============================================================================
# DESIGN PRINCIPLES
# =============================================================================
# 1. Single canonical intelligence database
# 2. Passive-RF-first matching only
# 3. Explainable, score-based identity inference
# 4. Protocol-family normalization before classification
# 5. Separation of device class, product profile, and burst evidence
# 6. Safe fallback to UNKNOWN when evidence is weak
# 7. Production-ready schema stability for engine evolution
#
# =============================================================================
# RESPONSIBILITY
# =============================================================================
# This file defines:
# - protocol family normalization metadata
# - global confidence thresholds and matching weights
# - canonical device profiles
# - canonical product profiles
# - canonical burst signatures
# - vendor normalization aliases
# - red-team surface mapping rules
#
# This file does NOT:
# - perform runtime classification
# - store live observations
# - contain offensive execution logic
#
# =============================================================================

metadata:
  name: "GhostRecon Device Intelligence Database"
  version: "v3.0.0"
  schema_version: "3.0"
  owner: "GhostRecon"
  description: "Canonical passive RF intelligence database for DeviceIntelligenceEngine v5.x"
  compatibility:
    min_engine_version: "5.0.0"
    max_engine_version: "5.x"
  notes:
    - "Merged and normalized replacement for prior device_signatures / protocol_device_profiles / rf_burst_signatures YAML files."
    - "Optimized for passive RF classification and red-team surface enrichment."

