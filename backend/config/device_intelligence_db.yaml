matching_weights:
  protocol_family: 0.22
  frequency_band: 0.14
  channel_hint: 0.05
  bandwidth: 0.10
  modulation: 0.12
  burst_interval: 0.12
  burst_duration: 0.10
  vendor_hint: 0.07
  name_hint: 0.03
  subtype_hint: 0.03
  temporal_behavior: 0.02

confidence_thresholds:
  unknown_score_threshold: 0.35
  weak_score_threshold: 0.48
  strong_score_threshold: 0.67
  product_score_threshold: 0.78
  min_win_margin: 0.08
  min_evidence_score: 0.30
  max_candidates: 5

