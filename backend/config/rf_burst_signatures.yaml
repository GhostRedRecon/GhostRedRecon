# =============================================================================
# ARCHITECTURE
# =============================================================================
#
# ReconEngine
#      ↓
# SignalEngine
#      ↓
# RF Behavior Extraction
#      ↓
# RFBurstSignatureEngine
#      ↓
# rf_burst_signatures.yaml  (THIS FILE)
#
# =============================================================================
# RESPONSIBILITY
# =============================================================================
#
# Provide product-level RF fingerprints.
#
# These signatures allow GhostRecon to identify
# specific IoT products using:
#
#   burst duration
#   periodicity
#   bandwidth
#   modulation
#
# This database enables:
#
#   Apple AirTag detection
#   SmartTag detection
#   Philips Hue detection
#   Xiaomi Aqara detection
#   Smart meter detection
#
# =============================================================================
# DESIGN PRINCIPLES
# =============================================================================
#
# ✔ Passive RF fingerprinting
# ✔ Device-model identification
# ✔ Burst-timing analysis
# ✔ No packet decoding required
# ✔ SDR-friendly detection
#
# =============================================================================

