    encryption_profile:
      expected: "rolling-code / challenge-response typical"
      common_schemes:
        - "rolling code (Keeloq-like families / proprietary variants)"
        - "challenge-response (varies by OEM)"
      key_management:
        - "factory/programmed secrets"
        - "paired receiver ↔ remote secret"
      notes:
        - "High entropy + rolling expected; treat replay feasibility as low/uncertain by default."

    offensive_profile:
      replay_feasible: true
      command_injection_feasible: low
      jamming_resilience: medium
