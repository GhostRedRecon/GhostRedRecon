      telemetry_bias: 0.6
      encryption_likelihood: medium

    encryption_profile:
      expected: "mixed (often proprietary, sometimes none)"
      common_schemes:
        - "vendor proprietary framing + optional crypto"
        - "AES-CTR/AES-CBC-like (if implemented; vendor-specific)"
      key_management:
        - "commissioned device key or controller key"
      notes:
        - "Expect structured telemetry; crypto presence varies by vendor/era."

    offensive_profile:
      replay_feasible: medium
      command_injection_feasible: medium
      jamming_resilience: medium
      requires_sync_capture: true

    bands:
      - start_mhz: 433.0
