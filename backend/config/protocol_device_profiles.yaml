# =============================================================================
# PROJECT:      GHOSTRECON
# FILE:         backend/intel/db/protocol_device_profiles.yaml
# VERSION:      v1.0.0
# LAST UPDATED: 2026-03-04
#
# =============================================================================
# ARCHITECTURE
# =============================================================================
#
# ReconEngine
#      ↓
# SignalEngine
#      ↓
# ProtocolSignatureEngine
#      ↓
# DeviceClassifierV2
#      ↓
# DeviceBehaviorEngine
#      ↓
# protocol_device_profiles.yaml  (THIS FILE)
#
# =============================================================================
# RESPONSIBILITY
# =============================================================================
#
# Provide protocol-level device classification.
#
# Maps:
#   RF bandwidth
#   frequency band
#   protocol family
#
# → into device classes.
#
# This database enables GhostRecon to identify:
#
#   WiFi infrastructure
#   Zigbee IoT devices
#   BLE peripherals
#   SubGHz sensors
#   Smart meters
#   LoRa telemetry
#
# WITHOUT decoding packets.
#
# =============================================================================
# DESIGN PRINCIPLES
# =============================================================================
#
# ✔ Protocol-first classification
# ✔ Hardware-agnostic device inference
# ✔ SDR-friendly detection parameters
# ✔ Passive RF analysis only
# ✔ Compatible with HackRF bandwidth limits
#
# =============================================================================

